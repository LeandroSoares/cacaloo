name: Security & Vulnerability Scan

on:
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub
  schedule:
    # Executa automaticamente toda segunda-feira às 03:00 UTC
    - cron: '0 3 * * 1'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # 1. DAST: OWASP ZAP Baseline Scan contra a URL pública
  # -------------------------------------------------------------
  dast-owasp-zap:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://cacaloo.com.br/'
          ruleset_file: ''
          cmd_options: '-a'
          allow_issue_writing: false
          artifact_name: 'zap-scan-report'

  # -------------------------------------------------------------
  # 2. Auditoria de Headers HTTP e Certificado SSL
  # -------------------------------------------------------------
  security-headers-audit:
    name: Security Headers & SSL Check
    runs-on: ubuntu-latest
    steps:
      - name: Inspect HTTP Security Headers
        run: |
          echo "=== Checking HTTP Response Headers for https://cacaloo.com.br/ ==="
          curl -I -s -L https://cacaloo.com.br/ > headers.txt
          cat headers.txt
          
          echo -e "\n=== Key Security Headers Verification ==="
          for header in "strict-transport-security" "content-security-policy" "x-frame-options" "x-content-type-options" "referrer-policy" "permissions-policy"; do
            if grep -qi "$header" headers.txt; then
              echo "✅ $header is present"
            else
              echo "⚠️ $header is MISSING"
            fi
          done

 
